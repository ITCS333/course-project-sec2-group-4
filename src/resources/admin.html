<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Resources</title>
    <link rel="stylesheet" href="style.css">
    <script src="admin.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1>Manage Course Resources</h1>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="../../index.html">Home</a></li>
                    <li><a href="../assignments/list.html">Assignments</a></li>
                    <li><a href="../weekly/list.html">Weekly</a></li>
                    <li><a href="../resources/list.html">Resources</a></li>
                    <li><a href="../discussion/board.html">Discussion</a></li>
                    <li><a href="../auth/login.html">Login</a></li>
                    <li><a href="../admin/manage_users.html">Admin</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section>
            <h2>Add a New Resource</h2>
            <form id="resource-form" action="#">
                <fieldset>
                    <legend>Resource Details</legend>
                    <label for="resource-title">Title</label>
                    <input id="resource-title" type="text" required>
                    <label for="resource-description">Description</label>
                    <textarea id="resource-description"></textarea>
                    <label for="resource-link">Link</label>
                    <input id="resource-link" type="url" required>
                    <button id="add-resource" type="submit">Add Resource</button>
                </fieldset>
            </form>
        </section>
        <section>
            <h2>Existing Resources</h2>
            <table id="resources-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Link</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="resources-tbody">
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
