<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Resources</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="admin.js" defer></script>
</head>
<body class="text-base leading-relaxed text-slate-600 antialiased">
    <!-- Navbar -->
    <nav class="bg-slate-800 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="../../index.html" class="text-xs uppercase tracking-widest text-slate-400 font-medium hover:text-white transition-colors">ITCS333 Hub</a>
                    <span class="text-sm font-medium text-white">Resource Management</span>
                </div>
                <div>
                    <a href="../../index.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Back to Home</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <header class="mb-12">
            <h1 class="text-4xl text-slate-900 font-medium">Manage Course Resources</h1>
        </header>

        <section class="mb-12">
            <h2 class="text-2xl text-slate-900 font-medium mb-6">Add a New Resource</h2>
            <form id="resource-form" action="#" class="bg-white rounded-xl border border-slate-100 p-8 border-t-2 border-indigo-500">
                <fieldset class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <legend class="sr-only">Resource Details</legend>
                    
                    <div class="space-y-2">
                        <label for="resource-title" class="text-xs uppercase tracking-widest text-slate-400 font-medium">Title</label>
                        <input id="resource-title" type="text" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    </div>

                    <div class="space-y-2">
                        <label for="resource-link" class="text-xs uppercase tracking-widest text-slate-400 font-medium">Link</label>
                        <input id="resource-link" type="url" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    </div>

                    <div class="space-y-2 md:col-span-2">
                        <label for="resource-description" class="text-xs uppercase tracking-widest text-slate-400 font-medium">Description</label>
                        <textarea id="resource-description" class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 min-h-[100px]"></textarea>
                    </div>

                    <div class="md:col-span-2">
                        <button id="add-resource" type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg px-6 py-2.5 text-sm font-medium transition-colors">Add Resource</button>
                    </div>
                </fieldset>
            </form>
        </section>

        <section>
            <h2 class="text-2xl text-slate-900 font-medium mb-6">Existing Resources</h2>
            <div class="bg-white rounded-xl border border-slate-100 border-t-2 border-slate-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table id="resources-table" class="min-w-full divide-y divide-slate-200">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-medium text-slate-400 uppercase tracking-widest">Title</th>
                                <th class="px-6 py-4 text-left text-xs font-medium text-slate-400 uppercase tracking-widest">Description</th>
                                <th class="px-6 py-4 text-left text-xs font-medium text-slate-400 uppercase tracking-widest">Link</th>
                                <th class="px-6 py-4 text-right text-xs font-medium text-slate-400 uppercase tracking-widest">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="resources-tbody" class="bg-white divide-y divide-slate-200"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </header>
</body>
</html>
