<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="details.js" defer></script>
</head>
<body class="text-base leading-relaxed text-slate-600 antialiased">
    <!-- Navbar -->
    <nav class="bg-slate-800 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="../../index.html" class="text-xs uppercase tracking-widest text-slate-400 font-medium hover:text-white transition-colors">ITCS333 Hub</a>
                    <a href="list.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Resources</a>
                </div>
                <div>
                    <a href="../../index.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Back to Home</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <header class="mb-12">
            <h1 id="resource-title" class="text-4xl text-slate-900 font-medium mb-4"></h1>
        </header>

        <article class="bg-white rounded-xl border border-slate-100 p-8 border-t-2 border-indigo-500 mb-12">
            <p id="resource-description" class="text-slate-600 mb-8 whitespace-pre-wrap"></p>
            <a id="resource-link" href="#" target="_blank" class="bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors inline-block w-max">Access Resource Material</a>
        </article>

        <section id="discussion-forum" class="bg-white rounded-xl border border-slate-100 p-8 border-t-2 border-emerald-500">
            <h2 class="text-2xl text-slate-900 font-medium mb-6">Discussion</h2>
            <div id="comment-list" class="space-y-6 mb-12"></div>
            
            <form id="comment-form" action="#" class="space-y-4">
                <fieldset class="border border-slate-200 rounded-lg p-6">
                    <legend class="text-sm uppercase tracking-widest text-slate-400 px-2 font-medium">Leave a Comment</legend>
                    <div class="mt-4">
                        <label for="new-comment" class="block text-sm font-medium text-slate-900 mb-1">Comment</label>
                        <textarea id="new-comment" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 min-h-[100px]"></textarea>
                    </div>
                    <button type="submit" class="mt-4 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">Post Comment</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
