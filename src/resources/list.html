<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Resources</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="list.js" defer></script>
</head>
<body class="text-base leading-relaxed text-slate-600 antialiased">
    <nav class="bg-slate-800 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="../../index.html" class="text-xs uppercase tracking-widest text-slate-400 font-medium hover:text-white transition-colors">ITCS333 Hub</a>

                    <h2 class="text-lg text-slate-900 font-medium mb-3"></h2>
