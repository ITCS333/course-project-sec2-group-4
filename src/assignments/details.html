<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="details.js" defer></script>
</head>
<body class="text-base leading-relaxed text-slate-600 antialiased">
    <!-- Navbar -->
    <nav class="bg-slate-800 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="../../index.html" class="text-xs uppercase tracking-widest text-slate-400 font-medium hover:text-white transition-colors">ITCS333 Hub</a>
                    <a href="list.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Assignments</a>
                </div>
                <div>
                    <a href="../../index.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Back to Home</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Column: Details -->
            <div class="lg:col-span-2 space-y-8">
                <header>
                    <h1 id="assignment-title" class="text-4xl text-slate-900 font-medium mb-4">Loading Assignment...</h1>
                    <div class="bg-slate-100 rounded-lg p-4 inline-block">
                        <span class="text-xs uppercase tracking-widest text-slate-400 block mb-1">Submission Deadline</span>
                        <span id="assignment-due-date" class="text-sm font-medium text-indigo-600">...</span>
                    </div>
                </header>

                <article class="bg-white rounded-xl border border-slate-100 p-8 border-t-2 border-indigo-500">
                    <h3 class="text-xs uppercase tracking-widest text-slate-400 font-medium mb-4">Description</h3>
                    <p id="assignment-description" class="text-slate-600 whitespace-pre-wrap">...</p>
                </article>

                <!-- Discussion Section -->
                <section id="discussion-forum" class="space-y-6">
                    <h2 class="text-2xl text-slate-900 font-medium">Questions & Discussion</h2>
                    
                    <div id="comment-list" class="space-y-4">
                        <!-- Comments injected here -->
                    </div>

                    <form id="comment-form" class="bg-white rounded-xl border border-slate-100 p-6 border-t-2 border-emerald-500">
                        <fieldset class="space-y-4">
                            <legend class="text-xs uppercase tracking-widest text-slate-400 font-medium mb-4">Ask a Question</legend>
                            <div>
                                <label for="new-comment" class="sr-only">Comment</label>
                                <textarea id="new-comment" required placeholder="Write your question or comment here..." class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 min-h-[120px]"></textarea>
                            </div>
                            <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">
                                Post Comment
                            </button>
                        </fieldset>
                    </form>
                </section>
            </div>

            <!-- Right Column: Resources -->
            <aside>
                <div class="bg-white rounded-xl border border-slate-100 p-6 border-t-2 border-indigo-500 sticky top-24">
                    <h3 class="text-xs uppercase tracking-widest text-slate-400 font-medium mb-4">Supporting Files</h3>
                    <ul id="assignment-files-list" class="space-y-3">
                        <!-- Files injected here -->
                    </ul>
                </div>
            </aside>
        </div>
    </main>
</body>
</html>
