<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-6 text-base leading-relaxed text-slate-600 antialiased">
    <main class="w-full max-w-md">
        <section class="bg-white rounded-xl border border-slate-100 p-8 border-t-2 border-indigo-500">
            <h2 class="text-2xl text-slate-900 font-medium mb-6">Welcome Back!</h2>
            <form id="login-form" action="#" class="space-y-4">
                <fieldset class="border border-slate-200 rounded-lg p-6 space-y-4">
                    <legend class="text-sm uppercase tracking-widest text-slate-400 px-2 font-medium">Secure Login</legend>
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-900 mb-1">Email Address</label>
                        <input type="email" id="email" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-900 mb-1">Password</label>
                        <input type="password" id="password" minlength="8" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    </div>
                    <div class="pt-2">
                        <button type="submit" id="login" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">Log In</button>
                    </div>
                </fieldset>
                <div id="message-container" class="text-center text-sm font-medium mt-4"></div>
            </form>
        </section>
    </main>
    <script src="login.js" defer></script>

</body>
</html>
