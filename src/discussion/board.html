<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="board.js" defer></script>
</head>
<body class="text-base leading-relaxed text-slate-600 antialiased">
    <nav class="bg-slate-800 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="../../index.html" class="text-xs uppercase tracking-widest text-slate-400 font-medium hover:text-white transition-colors">ITCS333 Hub</a>
                    <span class="text-sm font-medium text-white">Discussion Board</span>
                </div>
                <div>
                    <a href="../../index.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Back to Home</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <header class="mb-12">
            <h1 class="text-4xl text-slate-900 font-medium mb-4">General Discussion Board</h1>
            <p class="max-w-2xl">A place to ask questions, share insights, and connect with fellow students.</p>
        </header>

        <section class="mb-16">
            <h2 class="text-2xl text-slate-900 font-medium mb-6">Start a New Topic</h2>

            <form id="new-topic-form" action="#" class="bg-white rounded-xl border border-slate-100 p-8 border-t-2 border-emerald-500">
                <fieldset class="space-y-4">
                    <legend class="text-sm uppercase tracking-widest text-slate-400 font-medium px-2">New Topic Details</legend>

                    <div>
                        <label for="topic-subject" class="block text-sm font-medium text-slate-900 mb-1 mt-4">Subject:</label>
                        <input id="topic-subject" type="text" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    </div>

                    <div>
                        <label for="topic-message" class="block text-sm font-medium text-slate-900 mb-1">Message:</label>
                        <textarea id="topic-message" rows="6" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"></textarea>
                    </div>

                    <button id="create-topic" type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">Create Topic</button>
                </fieldset>
            </form>
        </section>

        <section>
            <h2 class="text-2xl text-slate-900 font-medium mb-6">All Topics</h2>

            <div id="topic-list-container" class="space-y-4"></div>
        </section>
    </main>
</body>
</html>
