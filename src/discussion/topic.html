<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discussion Topic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="topic.js" defer></script>
</head>
<body class="text-base leading-relaxed text-slate-600 antialiased">
    <!-- Navbar -->
    <nav class="bg-slate-800 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="../../index.html" class="text-xs uppercase tracking-widest text-slate-400 font-medium hover:text-white transition-colors">ITCS333 Hub</a>
                    <a href="board.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Discussion Board</a>
                </div>
                <div>
                    <a href="../../index.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Back to Home</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <header class="mb-12">
            <h1 id="topic-subject" class="text-4xl text-slate-900 font-medium mb-4">Loading Topic...</h1>
        </header>

        <!-- Original Post -->
        <article id="original-post" class="bg-white rounded-xl border border-slate-100 p-8 border-t-2 border-indigo-500 mb-12">
            <h2 class="sr-only">Original Post Details</h2>
            <p id="op-message" class="text-slate-600 mb-6 whitespace-pre-wrap"></p>
            <footer id="op-footer" class="text-xs uppercase tracking-widest text-slate-400">
                Posted by: <span id="op-author"></span> on <span id="op-created-at"></span>
            </footer>
            <div id="op-actions" class="mt-4">
                <!-- Admin actions like delete will go here -->
            </div>
        </article>

        <!-- Replies Section -->
        <section id="replies-section">
            <h2 class="text-2xl text-slate-900 font-medium mb-6">Replies</h2>
            
            <div id="reply-list-container" class="space-y-6 mb-12">
                <!-- Dynamic replies injected here -->
                <p class="text-center text-slate-400 animate-pulse font-medium">Loading replies...</p>
            </div>

            <form id="reply-form" action="#" class="bg-white rounded-xl border border-slate-100 p-8 border-t-2 border-emerald-500">
                <fieldset class="space-y-4">
                    <legend class="text-sm uppercase tracking-widest text-slate-400 font-medium px-2">Your Reply</legend>
                    
                    <div>
                        <label for="new-reply-author" class="block text-sm font-medium text-slate-900 mb-1 mt-4">Name</label>
                        <input type="text" id="new-reply-author" required placeholder="Your Name" class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    </div>

                    <div>
                        <label for="new-reply" class="block text-sm font-medium text-slate-900 mb-1">Reply:</label>
                        <textarea id="new-reply" required rows="6" placeholder="Write your reply here..." class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"></textarea>
                    </div>

                    <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">Post Reply</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
