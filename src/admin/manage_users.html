<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="manage_users.js" defer></script>
</head>
<body class="text-base leading-relaxed text-slate-600 antialiased">
    <header class="bg-slate-800 text-white py-4 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl font-medium">Admin Portal</h1>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <section id="password-management" class="bg-white rounded-xl border border-slate-100 p-6 mb-6">
            <h2 class="text-2xl text-slate-900 font-medium mb-4">Change Your Password</h2>
            <form action="#" id="password-form" class="space-y-4">
                <fieldset class="border border-slate-200 rounded-lg p-5">
                    <legend class="text-sm uppercase tracking-widest text-slate-400 px-2">Password Update</legend>
                    <div>
                        <label for="current-password" class="block text-sm font-medium text-slate-900 mb-1 mt-4">Current Password</label>
                        <input type="password" id="current-password" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    </div>
                    <div>
                        <label for="new-password" class="block text-sm font-medium text-slate-900 mb-1 mt-4">New Password</label>
                        <input type="password" id="new-password" minlength="8" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    </div>
                    <div>
                        <label for="confirm-password" class="block text-sm font-medium text-slate-900 mb-1 mt-4">Confirm New Password</label>
                        <input type="password" id="confirm-password" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                    </div>
                    <button type="submit" id="change" class="mt-6 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">Update Password</button>
                </fieldset>
            </form>
        </section>

        <section id="user-management" class="bg-white rounded-xl border border-slate-100 p-6 mb-6">
            <h2 class="text-2xl text-slate-900 font-medium mb-4">Manage Users</h2>
            <details class="border border-slate-200 rounded-lg p-5 mb-4">
                <summary class="text-lg text-slate-900 font-medium cursor-pointer">Add New User</summary>
                <form action="#" id="add-user-form" class="space-y-4 mt-4">
                    <fieldset class="border border-slate-200 rounded-lg p-5">
                        <legend class="text-sm uppercase tracking-widest text-slate-400 px-2">New User Information</legend>
                        <div>
                            <label for="user-name" class="block text-sm font-medium text-slate-900 mb-1 mt-4">Full Name</label>
                            <input type="text" id="user-name" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        </div>
                        <div>
                            <label for="user-email" class="block text-sm font-medium text-slate-900 mb-1 mt-4">Email</label>
                            <input type="email" id="user-email" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        </div>
                        <div>
                            <label for="default-password" class="block text-sm font-medium text-slate-900 mb-1 mt-4">Default Password</label>
                            <input type="password" id="default-password" minlength="8" required class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                        </div>
                        <div>
                            <label for="is-admin" class="block text-sm font-medium text-slate-900 mb-1 mt-4">Role</label>
                            <select id="is-admin" class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                            <option value="0">Student</option>
                            <option value="1">Admin</option>
                        </select>
                        </div>
                        <button type="submit" id="add" class="mt-6 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">Add User</button>
                    </fieldset>
                </form>
            </details>

            <h3 class="text-xl text-slate-900 font-medium mb-4 mt-8">Registered Users</h3>
            <input type="text" id="search-input" placeholder="Search by name or email..." autocomplete="off" class="block w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-900 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 mb-6">
            <table id="user-table" class="min-w-full divide-y divide-slate-200 border border-slate-200 rounded-lg overflow-hidden">
                <thead>
                    <tr class="bg-slate-100">
                        <th class="px-4 py-3 text-left text-xs font-medium text-slate-900 uppercase tracking-wider">Name</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-slate-900 uppercase tracking-wider">Email</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-slate-900 uppercase tracking-wider">Admin</th>
                        <th class="px-4 py-3 text-left text-xs font-medium text-slate-900 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="user-table-body" class="bg-white divide-y divide-slate-200">
                    <!-- User rows will be dynamically inserted here -->
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
