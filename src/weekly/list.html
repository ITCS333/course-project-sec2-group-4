<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Course Breakdown</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="list.js" defer></script>
</head>
<body class="text-base leading-relaxed text-slate-600 antialiased">
    <nav class="bg-slate-800 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-8">
                    <a href="../../index.html" class="text-xs uppercase tracking-widest text-slate-400 font-medium hover:text-white transition-colors">ITCS333 Hub</a>
                    <span class="text-sm font-medium text-white">Weekly Breakdown</span>
                </div>
                <div>
                    <a href="../../index.html" class="text-sm font-medium text-slate-300 hover:text-white transition-colors">Back to Home</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
        <header class="mb-12">
            <h1 class="text-4xl text-slate-900 font-medium mb-4">Weekly Course Breakdown</h1>
            <p class="max-w-2xl">Follow the curriculum week by week, accessing lecture notes and resources for each session.</p>
        </header>
        <section id="week-list-section" aria-live="polite" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="col-span-full py-12 text-center text-slate-400 animate-pulse font-medium">Loading weeks...</p>
        </section>
    </main>
</body>
</html>
